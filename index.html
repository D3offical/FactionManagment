<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="grid-bg" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="hud">

    <header class="hud__top">
      <div class="server-id">
        <span class="server-id__name" id="serverName">LOS SANTOS RP</span>
        <span class="server-id__code">FREQ 104.2 // GRID 07</span>
      </div>

      <div class="status" id="status">
        <span class="status__dot" id="statusDot"></span>
        <span class="status__text" id="statusText">Connecting</span>
      </div>
    </header>

    <div class="ticker" aria-hidden="true">
      <div class="ticker__track" id="tickerTrack"></div>
    </div>

    <main class="hud__center">
      <div class="radar" id="radar">
        <svg viewBox="0 0 200 200" class="radar__svg">
          <defs>
            <linearGradient id="sweepFade" x1="100" y1="100" x2="166.5" y2="33.5" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#55d6c9" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#55d6c9" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="94" class="radar__ring radar__ring--outer"/>
          <circle cx="100" cy="100" r="63" class="radar__ring"/>
          <circle cx="100" cy="100" r="32" class="radar__ring"/>
          <line x1="100" y1="6" x2="100" y2="194" class="radar__cross"/>
          <line x1="6" y1="100" x2="194" y2="100" class="radar__cross"/>
          <g id="radarBlips"></g>
          <g class="radar__sweep-group" id="radarSweep">
            <path d="M 100 100 L 100 6 A 94 94 0 0 1 166.5 33.5 Z" class="radar__sweep"/>
          </g>
        </svg>
        <div class="radar__pct" id="radarPct">0%</div>
      </div>

      <div class="headline">
        <h1 class="headline__title">Entering the city</h1>
        <p class="headline__tip" id="tip">Streaming world assets&hellip;</p>
      </div>
    </main>

    <footer class="hud__bottom">
      <div class="progress">
        <div class="progress__labels">
          <span id="progressLabel">Initializing</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress__track">
          <div class="progress__fill" id="progressFill"></div>
          <div class="progress__tick-row" id="progressTicks"></div>
        </div>
      </div>

      <div class="coords" id="coords">
        <span>LAT 34.0522</span>
        <span class="coords__sep">/</span>
        <span>LON -118.2437</span>
        <span class="coords__sep">/</span>
        <span id="coordZ">ALT 021</span>
      </div>
    </footer>

  </div>

<script src="script.js"></script>
</body>
</html>
